name: decompile-cfg (macos)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        # python-version: ['3.8', '3.9', '3.10']
        python-version: ['3.8', '3.9']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Until the next xdis release
        pip install git+https://github.com/rocky/python-xdis.git#egg=xdis
        # Until the next control-flow release
        pip install git+https://github.com/rocky/python-control-flow.git#egg=control_flow
        pip install -e .[dev]
    - name: Test decompile-cfg
      run: |
        # make check
        pytest pytest
